org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
# Which sprite packs ship inside the APK: a comma list of region names as they
# appear in web/sprites-<region>.pak, or "all". Kanto alone is ~43 MB; all nine
# are ~300 MB. Regions not shipped stay LOCKED in game (NEEDS PACK), exactly as
# on a board whose SD card lacks them. Override with -Ptamapoke.regions=...
tamapoke.regions=kanto
